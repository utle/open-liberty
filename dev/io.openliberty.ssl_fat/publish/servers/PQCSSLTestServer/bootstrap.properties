# Bootstrap properties for PQC SSL Test Server
bootstrap.include=../testports.properties

# Enable detailed SSL tracing for PQC debugging
com.ibm.ws.logging.trace.specification=*=info:SSL=all:com.ibm.ws.ssl.*=all:com.ibm.ws.channel.ssl.*=all:com.ibm.ws.crypto.*=all

# Maximum log file size (0 = unlimited)
com.ibm.ws.logging.max.file.size=0

# Console log level
com.ibm.ws.logging.console.log.level=INFO

